<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Kloak 3D Prints</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .admin-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }

      .login-form {
        background: var(--panel);
        border: 1px solid rgba(216, 166, 58, 0.35);
        border-radius: 0.5rem;
        padding: 2rem;
        max-width: 400px;
        margin: 3rem auto;
      }

      .login-form input {
        width: 100%;
        padding: 0.75rem;
        margin: 0.5rem 0 1rem;
        background: #000;
        color: var(--text);
        border: 1px solid var(--gold);
        border-radius: 0.25rem;
      }

      .admin-section {
        background: var(--panel);
        border: 1px solid rgba(216, 166, 58, 0.35);
        border-radius: 0.5rem;
        padding: 2rem;
        margin: 2rem 0;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0 0 1.5rem;
      }

      .tab-button {
        background: transparent;
        border: 1px solid rgba(216, 166, 58, 0.55);
        color: var(--gold-soft);
        padding: 0.6rem 1rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .tab-button.active {
        background: rgba(216, 166, 58, 0.15);
        border-color: var(--gold);
        color: var(--text);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .orders-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .order-card {
        background: rgba(0, 0, 0, 0.3);
        border-left: 3px solid var(--gold);
        padding: 1.5rem;
        border-radius: 0.25rem;
      }

      .order-card h4 {
        color: var(--gold-soft);
        margin: 0 0 0.5rem;
      }

      .order-info {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0.5rem 0;
      }

      .order-info strong {
        color: var(--text);
      }

      .order-info a {
        color: var(--gold-soft);
        text-decoration: underline;
      }

      .order-files {
        margin: 0.75rem 0;
        padding: 0.75rem;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(216, 166, 58, 0.25);
        border-radius: 0.25rem;
      }

      .order-files-title {
        color: var(--gold-soft);
        font-size: 0.9rem;
        margin: 0 0 0.5rem;
        font-weight: 600;
      }

      .order-files-list {
        margin: 0;
        padding-left: 1.25rem;
      }

      .order-files-list li {
        margin: 0.2rem 0;
      }

      .order-files-list a {
        color: var(--text);
      }

      .add-to-gallery-form {
        background: rgba(0, 0, 0, 0.3);
        padding: 1rem;
        border-radius: 0.25rem;
        margin-top: 1rem;
      }

      .form-group {
        margin: 1rem 0;
      }

      .form-group label {
        display: block;
        color: var(--text);
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        background: #000;
        color: var(--text);
        border: 1px solid var(--gold);
        border-radius: 0.25rem;
        font-family: inherit;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }

      .button-group {
        display: flex;
        gap: 1rem;
        margin-top: 1rem;
      }

      .button-small {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }

      .btn-approve {
        background: #2f5d8c;
        color: #fff;
      }

      .btn-approve:hover {
        background: #1a3a56;
      }

      .btn-cancel {
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold-soft);
      }

      .gallery-posts-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }

      .gallery-post-card {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(216, 166, 58, 0.35);
        border-radius: 0.25rem;
        padding: 1rem;
      }

      .gallery-post-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 0.25rem;
        margin-bottom: 0.5rem;
      }

      .gallery-post-card h5 {
        color: var(--gold-soft);
        margin: 0.5rem 0;
      }

      .gallery-post-card p {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0;
      }

      .btn-delete {
        background: #8a1d1d;
        color: #fff;
        font-size: 0.85rem;
        padding: 0.4rem 0.8rem;
        margin-top: 0.5rem;
      }

      .status-pending {
        color: #f5d47d;
        font-weight: 600;
      }

      .order-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 1rem 0;
      }

      .order-status input[type="checkbox"] {
        width: auto;
        cursor: pointer;
      }

      .order-status label {
        margin: 0;
        cursor: pointer;
        color: var(--gold-soft);
      }

      .file-upload-group {
        margin: 1rem 0;
      }

      .file-input-wrapper {
        position: relative;
        display: inline-block;
        width: 100%;
      }

      .file-input-wrapper input[type="file"] {
        display: none;
      }

      .file-upload-label {
        display: block;
        padding: 0.75rem;
        background: #000;
        color: var(--text);
        border: 1px solid var(--gold);
        border-radius: 0.25rem;
        cursor: pointer;
        text-align: center;
        transition: all 0.3s ease;
      }

      .file-upload-label:hover {
        background: rgba(216, 166, 58, 0.1);
        border-color: var(--gold-soft);
      }

      .file-upload-label.uploading {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .upload-status {
        font-size: 0.85rem;
        color: var(--gold-soft);
        margin-top: 0.5rem;
      }

      .upload-error {
        color: #ff6b6b;
      }

      .order-status-badge {
        display: inline-block;
        margin-bottom: 0.5rem;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.78rem;
        background: rgba(216, 166, 58, 0.15);
        color: var(--gold-soft);
        border: 1px solid rgba(216, 166, 58, 0.35);
      }
    </style>
  </head>
  <body>
    <header class="hero hero--compact">
      <div class="hero__content">
        <div class="hero__topbar">
          <a class="brand" href="./home.html">Kloak 3D Prints</a>
          <h1 class="hero__headline">⚔️ Admin Portal</h1>
          <button id="logout-btn" class="hero__link" style="background: none; border: none; cursor: pointer; color: var(--gold-soft);">Logout</button>
        </div>
      </div>
    </header>

    <main>
      <div id="login-page">
        <div class="login-form">
          <h2 style="color: var(--gold-soft); text-align: center;">Admin Login</h2>
          <form id="login-form">
            <input type="password" id="password" placeholder="Enter admin password" required />
            <button type="submit" class="button button--primary" style="width: 100%;">Login</button>
          </form>
        </div>
      </div>

      <div id="admin-page" style="display: none;">
        <div class="admin-container">
          <section class="admin-section">
            <h2>📋 Orders Workflow</h2>
            <div class="tabs" role="tablist" aria-label="Order workflow tabs">
              <button class="tab-button active" type="button" role="tab" aria-selected="true" aria-controls="tab-not-completed" data-tab-target="tab-not-completed">Not Completed</button>
              <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="tab-gallery-needed" data-tab-target="tab-gallery-needed">Completed - Gallery Needed</button>
              <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="tab-fully-completed" data-tab-target="tab-fully-completed">Fully Completed</button>
            </div>

            <div id="tab-not-completed" class="tab-panel active" role="tabpanel">
              <div id="orders-not-completed" class="orders-list">
                <p style="color: var(--muted);">Loading orders...</p>
              </div>
            </div>

            <div id="tab-gallery-needed" class="tab-panel" role="tabpanel">
              <div id="orders-gallery-needed" class="orders-list">
                <p style="color: var(--muted);">Loading orders...</p>
              </div>
            </div>

            <div id="tab-fully-completed" class="tab-panel" role="tabpanel">
              <div id="orders-fully-completed" class="orders-list">
                <p style="color: var(--muted);">Loading orders...</p>
              </div>
            </div>
          </section>

          <section class="admin-section">
            <h2>🖼️ Gallery Posts</h2>
            <div id="gallery-posts" class="gallery-posts-list">
              <p style="color: var(--muted);">Loading gallery posts...</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
      const SUPABASE_URL = 'https://dhzrhgyjpqotoujfwdwl.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoenJoZ3lqcHFvdG91amZ3ZHdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzOTk0MzcsImV4cCI6MjA5OTk3NTQzN30.rK02i_fFqcsZO6s9TCy-WUhXYic7Gg7p1Lrfrdu0qqI';
      const ADMIN_PASSWORD = 'Eirik2024'; // Change this to your preferred password

      let supabaseClient;
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      const loginForm = document.getElementById('login-form');
      const passwordInput = document.getElementById('password');
      const loginPage = document.getElementById('login-page');
      const adminPage = document.getElementById('admin-page');
      const logoutBtn = document.getElementById('logout-btn');

      // Check if already logged in
      if (sessionStorage.getItem('adminLoggedIn') === 'true') {
        showAdminPage();
      }

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (passwordInput.value === ADMIN_PASSWORD) {
          sessionStorage.setItem('adminLoggedIn', 'true');
          showAdminPage();
        } else {
          alert('Incorrect password');
          passwordInput.value = '';
        }
      });

      logoutBtn.addEventListener('click', () => {
        sessionStorage.removeItem('adminLoggedIn');
        adminPage.style.display = 'none';
        loginPage.style.display = 'block';
        passwordInput.value = '';
      });

      function showAdminPage() {
        loginPage.style.display = 'none';
        adminPage.style.display = 'block';
        setupTabs();
        loadOrdersWorkflow();
        loadGalleryPosts();
      }

      function setupTabs() {
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabPanels = document.querySelectorAll('.tab-panel');

        tabButtons.forEach((button) => {
          button.addEventListener('click', () => {
            const targetId = button.dataset.tabTarget;

            tabButtons.forEach((btn) => {
              btn.classList.remove('active');
              btn.setAttribute('aria-selected', 'false');
            });

            tabPanels.forEach((panel) => {
              panel.classList.remove('active');
            });

            button.classList.add('active');
            button.setAttribute('aria-selected', 'true');

            const panel = document.getElementById(targetId);
            if (panel) {
              panel.classList.add('active');
            }
          });
        });
      }

      async function resolveImageUrl(imageRef) {
        if (!imageRef || !supabaseClient) return '';

        const value = String(imageRef).trim();
        if (!value) return '';

        const customPrefix = 'print-uploads:';
        const publicPrefix = `${SUPABASE_URL}/storage/v1/object/public/print-uploads/`;
        let filePath = '';

        if (value.startsWith(customPrefix)) {
          filePath = value.slice(customPrefix.length);
        } else if (value.startsWith(publicPrefix)) {
          filePath = decodeURIComponent(value.slice(publicPrefix.length));
        } else if (/^https?:\/\//i.test(value)) {
          return value;
        } else {
          filePath = value.replace(/^\/+/, '');
        }

        const { data, error } = await supabaseClient.storage
          .from('print-uploads')
          .createSignedUrl(filePath, 60 * 60 * 24 * 7);

        if (!error && data?.signedUrl) {
          return data.signedUrl;
        }

        const { data: publicData } = supabaseClient.storage
          .from('print-uploads')
          .getPublicUrl(filePath);

        return publicData?.publicUrl || '';
      }

      function renderOrderFields(order) {
        const colors = Array.isArray(order.selected_colors) && order.selected_colors.length > 0
          ? order.selected_colors.join(', ')
          : 'None provided';

        const sourceLinkMarkup = order.source_link
          ? `<div class="order-info"><strong>Source Link:</strong> <a href="${order.source_link}" target="_blank" rel="noopener noreferrer">${order.source_link}</a></div>`
          : '<div class="order-info"><strong>Source Link:</strong> None provided</div>';

        return `
          <div class="order-info"><strong>Name:</strong> ${order.name || 'No name provided'}</div>
          <div class="order-info"><strong>Email:</strong> ${order.email || 'No email provided'}</div>
          <div class="order-info"><strong>Phone:</strong> ${order.phone || 'No phone provided'}</div>
          <div class="order-info"><strong>Order Type:</strong> ${order.service || 'No order type provided'}</div>
          <div class="order-info"><strong>Colors:</strong> ${colors}</div>
          <div class="order-info"><strong>Notes:</strong> ${order.notes || 'No notes provided'}</div>
          ${sourceLinkMarkup}
          <div class="order-info"><strong>Allow Gallery Post:</strong> ${order.allow_gallery_post ? 'Yes' : 'No'}</div>
        `;
      }

      async function renderFileLinks(order) {
        const fileNames = Array.isArray(order.file_names) ? order.file_names : [];
        const filePaths = Array.isArray(order.file_paths) ? order.file_paths : [];

        if (filePaths.length === 0) {
          return '<div class="order-info"><strong>Downloadable Files:</strong> None uploaded</div>';
        }

        const fileLinks = await Promise.all(filePaths.map(async (filePath, index) => {
          const fileName = fileNames[index] || filePath.split('/').pop() || `file-${index + 1}`;
          const fileUrl = await resolveImageUrl(`print-uploads:${filePath}`);

          if (!fileUrl) {
            return `<li>${fileName} (link unavailable)</li>`;
          }

          return `<li><a href="${fileUrl}" target="_blank" rel="noopener noreferrer" download>${fileName}</a></li>`;
        }));

        return `
          <div class="order-files">
            <div class="order-files-title">Downloadable Files</div>
            <ul class="order-files-list">${fileLinks.join('')}</ul>
          </div>
        `;
      }

      async function buildOrderCard(order, options = {}) {
        const fileMarkup = await renderFileLinks(order);
        const statusLabel = order.status === 'completed' ? 'Completed' : 'Not Completed';
        const showCompleteToggle = options.showCompleteToggle === true;
        const showGalleryForm = options.showGalleryForm === true;
        const showReopenToggle = options.showReopenToggle === true;

        return `
          <div class="order-card">
            <div class="order-status-badge">${statusLabel}</div>
            ${renderOrderFields(order)}
            ${fileMarkup}

            ${showCompleteToggle ? `
              <div class="order-status">
                <input type="checkbox" id="complete-${order.id}" class="order-complete-checkbox" data-order-id="${order.id}" />
                <label for="complete-${order.id}">Mark as Completed</label>
              </div>
            ` : ''}

            ${showReopenToggle ? `
              <div class="order-status">
                <input type="checkbox" id="reopen-${order.id}" class="order-reopen-checkbox" data-order-id="${order.id}" checked />
                <label for="reopen-${order.id}">Completed (uncheck to move back to Not Completed)</label>
              </div>
            ` : ''}

            ${showGalleryForm ? `
              <div class="add-to-gallery-form">
                <h5 style="color: var(--gold-soft); margin: 0 0 1rem;">Add to Gallery</h5>
                <div class="form-group">
                  <label>Gallery Title</label>
                  <input type="text" class="gallery-title" placeholder="Name of the print" value="${order.name || ''}" />
                </div>
                <div class="form-group">
                  <label>Description</label>
                  <textarea class="gallery-description" placeholder="Describe the print, colors used, etc...">${order.notes || ''}</textarea>
                </div>
                <div class="file-upload-group">
                  <label style="display: block; color: var(--text); margin-bottom: 0.5rem; font-weight: 600;">Upload Image</label>
                  <div class="file-input-wrapper">
                    <input type="file" id="file-${order.id}" class="gallery-image-file" accept="image/*" />
                    <label class="file-upload-label" for="file-${order.id}">Click to upload image</label>
                  </div>
                  <div class="upload-status" style="display: none;"></div>
                </div>
                <div class="form-group">
                  <label>Image URL (or use file upload above)</label>
                  <input type="url" class="gallery-image" placeholder="https://..." />
                </div>
                <div class="button-group">
                  <button class="button button-small btn-approve" onclick="addToGallery('${order.id}', this)">Add to Gallery</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      async function renderOrdersInto(containerId, orders, options = {}) {
        const container = document.getElementById(containerId);

        if (!orders || orders.length === 0) {
          container.innerHTML = '<p style="color: var(--muted);">No orders in this tab.</p>';
          return;
        }

        const cards = await Promise.all(orders.map((order) => buildOrderCard(order, options)));
        container.innerHTML = cards.join('');
      }

      async function loadOrdersWorkflow() {
        try {
          const { data: orders, error: ordersError } = await supabaseClient
            .from('orders')
            .select('*')
            .order('created_at', { ascending: false });

          if (ordersError) throw ordersError;

          const { data: galleryPosts, error: galleryError } = await supabaseClient
            .from('gallery_posts')
            .select('order_id');

          if (galleryError) throw galleryError;

          const postedOrderIds = new Set(
            (galleryPosts || [])
              .map((post) => post.order_id)
              .filter((id) => id !== null && id !== undefined)
              .map((id) => String(id))
          );

          const allOrders = (orders || []).map((order) => ({
            ...order,
            is_posted_to_gallery: postedOrderIds.has(String(order.id))
          }));

          const notCompleted = allOrders.filter((order) => order.status !== 'completed');
          const completedNeedsGallery = allOrders.filter(
            (order) => order.status === 'completed' && order.allow_gallery_post && !order.is_posted_to_gallery
          );
          const fullyCompleted = allOrders.filter(
            (order) => order.status === 'completed' && (!order.allow_gallery_post || order.is_posted_to_gallery)
          );

          await renderOrdersInto('orders-not-completed', notCompleted, { showCompleteToggle: true });
          await renderOrdersInto('orders-gallery-needed', completedNeedsGallery, { showGalleryForm: true, showReopenToggle: true });
          await renderOrdersInto('orders-fully-completed', fullyCompleted, { showReopenToggle: true });

          setupOrderHandlers();
        } catch (error) {
          console.error('Error loading workflow orders:', error);
        }
      }

      async function addToGallery(orderId, button) {
        const card = button.closest('.order-card');
        const title = card.querySelector('.gallery-title').value;
        const description = card.querySelector('.gallery-description').value;
        const imageRef = card.querySelector('.gallery-image').value;

        if (!title || !imageRef) {
          alert('Please fill in title and image URL');
          return;
        }

        try {
          button.disabled = true;
          button.textContent = 'Adding...';

          const { data, error } = await supabaseClient
            .from('gallery_posts')
            .insert([{
              order_id: orderId,
              title,
              description,
              image_url: imageRef,
              created_at: new Date().toISOString()
            }]);

          if (error) throw error;

          alert('Added to gallery!');
          loadOrdersWorkflow();
          loadGalleryPosts();
        } catch (error) {
          console.error('Error adding to gallery:', error);
          alert('Error adding to gallery');
        } finally {
          button.disabled = false;
          button.textContent = 'Add to Gallery';
        }
      }

      async function loadGalleryPosts() {
        try {
          const { data, error } = await supabaseClient
            .from('gallery_posts')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;

          const container = document.getElementById('gallery-posts');
          if (!data || data.length === 0) {
            container.innerHTML = '<p style="color: var(--muted);">No gallery posts yet.</p>';
            return;
          }

          const postsWithUrls = await Promise.all(data.map(async (post) => ({
            ...post,
            resolved_image_url: await resolveImageUrl(post.image_url)
          })));

          container.innerHTML = postsWithUrls.map(post => `
            <div class="gallery-post-card">
              <img src="${post.resolved_image_url || post.image_url}" alt="${post.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22250%22 height=%22200%22%3E%3Crect fill=%22%231a140d%22 width=%22250%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23b5a98d%22 font-size=%2214%22%3EImage not found%3C/text%3E%3C/svg%3E'" />
              <h5>${post.title}</h5>
              <p>${post.description || 'No description'}</p>
              <button class="button button-small btn-delete" onclick="deleteGalleryPost(${post.id})">Delete</button>
            </div>
          `).join('');
        } catch (error) {
          console.error('Error loading gallery posts:', error);
        }
      }

      async function deleteGalleryPost(postId) {
        if (!confirm('Delete this gallery post?')) return;

        try {
          const { error } = await supabaseClient
            .from('gallery_posts')
            .delete()
            .eq('id', postId);

          if (error) throw error;

          alert('Deleted!');
          loadGalleryPosts();
        } catch (error) {
          console.error('Error deleting post:', error);
          alert('Error deleting post');
        }
      }

      // Setup file upload handlers and completion toggles after loading orders
      function setupOrderHandlers() {
        // File upload handlers
        const fileInputs = document.querySelectorAll('.gallery-image-file');
        fileInputs.forEach(fileInput => {
          const wrapper = fileInput.closest('.file-input-wrapper');
          const label = wrapper.querySelector('.file-upload-label');
          const statusDiv = wrapper.nextElementSibling;

          fileInput.addEventListener('change', async (e) => {
            if (e.target.files.length === 0) return;

            const file = e.target.files[0];
            const imageInput = fileInput.closest('.file-upload-group').nextElementSibling.querySelector('.gallery-image');

            label.classList.add('uploading');
            label.textContent = 'Uploading...';

            try {
              // Upload to Supabase Storage
              const filePath = `gallery/${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
              const { error } = await supabaseClient.storage
                .from('print-uploads')
                .upload(filePath, file);

              if (error) throw error;

              imageInput.value = `print-uploads:${filePath}`;

              statusDiv.style.display = 'block';
              statusDiv.className = 'upload-status';
              statusDiv.textContent = '✓ Image uploaded successfully';
            } catch (error) {
              console.error('Upload error:', error);
              statusDiv.style.display = 'block';
              statusDiv.className = 'upload-status upload-error';
              statusDiv.textContent = '✗ Upload failed: ' + error.message;
            } finally {
              label.classList.remove('uploading');
              label.textContent = 'Click to upload image';
            }
          });
        });

        // Completion toggle handlers
        const checkboxes = document.querySelectorAll('.order-complete-checkbox');
        checkboxes.forEach(checkbox => {
          checkbox.addEventListener('change', async (e) => {
            const orderId = e.target.dataset.orderId;
            const isCompleted = e.target.checked;
            await updateOrderStatus(orderId, isCompleted ? 'completed' : 'new');
          });
        });

        const reopenCheckboxes = document.querySelectorAll('.order-reopen-checkbox');
        reopenCheckboxes.forEach((checkbox) => {
          checkbox.addEventListener('change', async (e) => {
            const orderId = e.target.dataset.orderId;
            const isCompleted = e.target.checked;
            await updateOrderStatus(orderId, isCompleted ? 'completed' : 'new');
          });
        });
      }

      async function updateOrderStatus(orderId, status) {
        try {
          const { error } = await supabaseClient
            .from('orders')
            .update({ status })
            .eq('id', orderId);

          if (error) throw error;

          loadOrdersWorkflow();
        } catch (error) {
          console.error('Error updating order status:', error);
          alert('Error updating order status');
        }
      }
    </script>
  </body>
</html>
